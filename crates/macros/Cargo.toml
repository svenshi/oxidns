[package]
name = "oxidns-macros"
version = "0.1.1"
edition = "2024"
authors = ["Sven Shi <isvenshi@gmail.com>"]
description = "Proc macros for OxiDNS."
repository = "https://github.com/svenshi/oxidns"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
