name: Hotpath

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - justfile
      - .github/hotpath-benchmarks.json
      - .github/scripts/hotpath*.py
      - .github/workflows/hotpath.yml
      - .github/workflows/hotpath-comment.yml
  pull_request:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark selection
        type: choice
        options: [core, all]
        default: core

permissions:
  contents: read

jobs:
  catalog:
    if: github.repository == 'svenshi/oxidns'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      tier: ${{ steps.catalog.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate report tooling
        run: python3 -m unittest discover -s .github/scripts -p 'hotpath*_test.py'
      - id: catalog
        env:
          TIER: ${{ github.event_name == 'schedule' && 'all' || inputs.suite || 'core' }}
        run: |
          matrix=$(python3 .github/scripts/hotpath.py catalog --tier "$TIER")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
  benchmark:
    if: github.repository == 'svenshi/oxidns'
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    concurrency:
      group: hotpath-${{ matrix.target }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Download last successful default-branch baseline
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_BRANCH: ${{ github.event.repository.default_branch }}
          BENCH_TARGET: ${{ matrix.target }}
        run: |
          run_id=$(gh run list --workflow hotpath.yml --branch "$BASELINE_BRANCH" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name "hotpath-$BENCH_TARGET" --dir hotpath-baseline
          fi
      - name: Run native and Callgrind benchmarks
        env:
          BENCH_TARGET: ${{ matrix.target }}
          TIER: ${{ needs.catalog.outputs.tier }}
        run: |
          python3 .github/scripts/hotpath.py run \
            --target "$BENCH_TARGET" --tier "$TIER" --output hotpath-reports
      - name: Evaluate performance gate
        if: always()
        run: |
          mkdir -p hotpath-reports
          python3 .github/scripts/hotpath.py gate hotpath-reports \
            --baseline hotpath-baseline --output hotpath-reports/gate/result.json \
            > hotpath-reports/summary.md
      - name: Write benchmark summary
        if: always()
        run: |
          if [ ! -s hotpath-reports/summary.md ]; then
            mkdir -p hotpath-reports
            echo '## 🔴 Benchmark execution or report validation failed' > hotpath-reports/summary.md
          fi
          cat hotpath-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hotpath-${{ matrix.target }}
          path: hotpath-reports/
          retention-days: 14
          if-no-files-found: error
  gate:
    name: Performance gate
    if: github.repository == 'svenshi/oxidns' && always()
    needs: [catalog, benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful benchmark and regression checks
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          test "$CATALOG_RESULT" = success
          test "$BENCHMARK_RESULT" = success
